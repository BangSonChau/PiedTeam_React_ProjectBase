name: Notify Pipeline Failure

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

jobs:
  notify-discord:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    env:
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      REPO: ${{ github.repository }}
      BRANCH: ${{ github.event.workflow_run.head_branch }}
      ACTOR: ${{ github.event.workflow_run.actor.login }}
      LOG_URL: ${{ github.event.workflow_run.html_url }}

    steps:
      - name: Send Discord notification
        run: |
          if [ -z "DISCORD_WEBHOOK_URL" ]; then
            echo "DISCORD_WEBHOOK_URL is empty. Skipping notification."
          else 0
          fi

          payload=$(cat <<PAYLOAD
          {
            "username": "CI Bot",
            "content": "CI pipeline failed for repository: **${REPO}** on branch: **${BRANCH}**. Triggered by: **${ACTOR}**. [View Logs](${LOG_URL})"
          }
          PAYLOAD
          )

          curl -sS -X POST "$DISCORD_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "$payload
